<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="バイク整備"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>バイク整備記録</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0f3;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#17191c}.app{max-width:430px;margin:auto;min-height:100vh;background:#f7f7f8;padding:16px 14px 40px}h1{font-size:24px;margin:4px 4px 16px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #0001}.bike{border:1px solid #e2e4e8}.name{font-size:20px;font-weight:700}.muted{color:#737980;font-size:13px}.km{font-size:25px;font-weight:800;margin-top:8px}.kmrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.bikephoto{width:57px;height:57px;border-radius:10px;object-fit:cover;background:#eef0f3;border:1px solid #d6d9dd;flex:none}.photoBtn{border:0;background:#e7e9ec;border-radius:8px;padding:6px 8px;font-size:12px;margin-top:6px}.photobox{display:flex;flex-direction:column;align-items:flex-end;flex:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f1f3f5;border-radius:12px;padding:11px}.stat b{font-size:18px}.warn{background:#fff4df;border-left:5px solid #e39b20}.ok{background:#eaf7ed;border-left:5px solid #39a85a}.danger{background:#ffe9e9;border-left:5px solid #d84b4b}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:#111;color:white;margin-top:9px}.btn.secondary{background:#e7e9ec;color:#17191c}.section-title{font-size:17px;font-weight:800;margin:18px 4px 8px}.screen{display:none}.screen.active{display:block}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;font:inherit;border:1px solid #d6d9dd;border-radius:10px;padding:12px;background:#fff}textarea{min-height:80px}.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{border:0;background:#e7e9ec;border-radius:10px;padding:9px 12px;font-size:15px}.history{border-top:1px solid #eee;padding:12px 0}.tag{display:inline-block;background:#eef0f3;border-radius:999px;padding:4px 8px;font-size:12px;margin:3px 4px 3px 0}.empty{color:#888;text-align:center;padding:20px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:999px;display:none;z-index:5}.note{font-size:12px;color:#737980;line-height:1.5}.footer{font-size:11px;color:#8a8f95;text-align:center;margin-top:25px}</style></head><body><main class="app">
<div id="home" class="screen active"><h1>バイク整備記録</h1><div class="muted" style="margin:0 4px 12px">iPhoneアプリ版 / データは端末に保存</div><div id="bikeList"></div><div class="section-title">⚠️ 整備の警告</div><div id="warnings"></div><button class="btn" onclick="openMileage()">＋走行距離を更新</button><button class="btn secondary" onclick="openRecord()">＋整備を記録</button><button class="btn secondary" onclick="backupData()">データをバックアップ</button><button class="btn secondary" onclick="document.getElementById('restoreFile').click()">バックアップから復元</button><input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="restoreData(event)"><div class="section-title">最近の整備</div><div id="recent"></div><div class="footer">v0.8 iPhone版 / バイク写真対応・オフライン対応・バックアップ対応</div></div>
<div id="detail" class="screen"><div class="topbar"><button class="back" onclick="show('home')">← 戻る</button><div><b id="detailName"></b><div class="muted" id="detailKm"></div></div></div><div id="detailStats"></div><div class="section-title">整備履歴</div><div class="card" id="detailHistory"></div><button class="btn" onclick="openRecord(currentBike)">＋このバイクの整備を記録</button></div>
<div id="mileage" class="screen"><div class="topbar"><button class="back" onclick="show('home')">← 戻る</button><b>走行距離を更新</b></div><div class="card"><label>バイク</label><select id="mBike"></select><label>現在の走行距離（km）</label><input id="mKm" type="number" inputmode="numeric" min="0" step="1"><button class="btn" onclick="saveMileage()">保存する</button></div></div>
<div id="record" class="screen"><div class="topbar"><button class="back" onclick="show('home')">← 戻る</button><b>整備を記録</b></div><div class="card"><label>バイク</label><select id="rBike"></select><label>整備項目</label><select id="rType"><option>オイル交換</option><option>オイルフィルター交換</option><option>タイヤ交換</option><option>チェーン整備</option><option>ブレーキ整備</option><option>スパークプラグ交換</option><option>エアフィルター交換</option><option>バッテリー交換</option><option>その他</option></select><label>日付</label><input id="rDate" type="date"><label>整備時の走行距離（km）</label><input id="rKm" type="number" inputmode="numeric"><label>費用（円）</label><input id="rCost" type="number" inputmode="numeric" placeholder="0"><label>メモ</label><textarea id="rNote" placeholder="使用オイル、部品、症状など"></textarea><button class="btn" onclick="saveRecord()">保存する</button></div></div>
</main><div id="toast" class="toast"></div><script>
const KEY='myBikeMaintenance_v06';const defaults={version:6,bikes:[{id:'yb',name:'YB125SP',km:12345,fuel:32.1,photo:'',,oilInterval:2000,lastOilKm:12000},{id:'ds',name:'DragStar 250',km:8920,fuel:28.6,photo:'',,oilInterval:2000,lastOilKm:7040}],records:[]};let data=load(),currentBike='yb';function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.bikes)return x}catch(e){}return JSON.parse(JSON.stringify(defaults))}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function bike(id){return data.bikes.find(b=>b.id===id)}function fmt(n){return Number(n).toLocaleString('ja-JP')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',1800)}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0);if(id==='home')renderHome()}function renderHome(){document.getElementById('bikeList').innerHTML=data.bikes.map(b=>`<div class="card bike" onclick="openDetail('${b.id}')"><div class="name">${b.name}</div><div class="kmrow"><div><div class="muted">現在の走行距離</div><div class="km">${fmt(b.km)} km</div></div><div class="photobox"><img class="bikephoto" src="${b.photo||''}" ${b.photo?'':'style="display:none"'}><button class="photoBtn" onclick="event.stopPropagation();choosePhoto('${b.id}')">${b.photo?'写真変更':'写真を追加'}</button><input id="photo-${b.id}" type="file" accept="image/*" style="display:none" onchange="savePhoto(event,'${b.id}')"></div></div><div class="grid" style="margin-top:10px"><div class="stat"><div class="muted">燃費</div><b>${b.fuel} km/L</b></div><div class="stat"><div class="muted">次回オイル</div><b>${fmt(b.lastOilKm+b.oilInterval)} km</b></div></div></div>`).join('');let ws=[];data.bikes.forEach(b=>{let d=b.lastOilKm+b.oilInterval-b.km;if(d<=300)ws.push(`<div class="card ${d<=0?'danger':'warn'}"><b>${b.name}</b><br>${d<=0?'オイル交換時期を超過 '+fmt(-d)+' km':'オイル交換まであと '+fmt(d)+' km'}</div>`)});document.getElementById('warnings').innerHTML=ws.length?ws.join(''):`<div class="card ok">現在、交換時期が近い項目はありません。</div>`;let recent=[...data.records].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);document.getElementById('recent').innerHTML=recent.length?`<div class="card">${recent.map(r=>`<div class="history"><b>${bike(r.bikeId).name}</b>　${r.type}<br><span class="tag">${r.date}</span><span class="tag">${fmt(r.km)} km</span>${r.cost?`<span class="tag">${fmt(r.cost)}円</span>`:''}<div class="muted">${esc(r.note||'')}</div></div>`).join('')}</div>`:`<div class="card empty">まだ整備記録がありません</div>`}function openDetail(id){currentBike=id;let b=bike(id),target=b.lastOilKm+b.oilInterval,d=target-b.km;document.getElementById('detailName').textContent=b.name;document.getElementById('detailKm').textContent=fmt(b.km)+' km';document.getElementById('detailStats').innerHTML=`<div class="grid"><div class="card stat"><div class="muted">燃費</div><b>${b.fuel} km/L</b></div><div class="card stat"><div class="muted">次回オイル</div><b>${fmt(target)} km</b></div></div><div class="card ${d<=0?'danger':d<=300?'warn':'ok'}"><b>オイル</b><br>${d<=0?'交換時期を超過 '+fmt(-d)+' km':'あと '+fmt(d)+' km'}</div>`;let rs=data.records.filter(r=>r.bikeId===id).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('detailHistory').innerHTML=rs.length?rs.map(r=>`<div class="history"><b>${r.type}</b><br><span class="tag">${r.date}</span><span class="tag">${fmt(r.km)} km</span>${r.cost?`<span class="tag">${fmt(r.cost)}円</span>`:''}<div class="muted">${esc(r.note||'')}</div></div>`).join(''):`<div class="empty">整備履歴はありません</div>`;show('detail')}function choosePhoto(id){document.getElementById('photo-'+id).click()}function savePhoto(e,id){const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('画像を選択してください');const reader=new FileReader();reader.onload=()=>{const b=bike(id);b.photo=reader.result;save();renderHome();toast('写真を保存しました')};reader.readAsDataURL(f);e.target.value=''}function fillSelects(){['mBike','rBike'].forEach(id=>document.getElementById(id).innerHTML=data.bikes.map(b=>`<option value="${b.id}">${b.name}</option>`).join(''))}function openMileage(){fillSelects();document.getElementById('mBike').value=currentBike;document.getElementById('mKm').value=bike(currentBike).km;show('mileage')}function saveMileage(){let id=document.getElementById('mBike').value,b=bike(id),km=Number(document.getElementById('mKm').value);if(!Number.isFinite(km)||km<0)return toast('走行距離を入力してください');if(km<b.km)return toast('前回より少ない距離は保存できません');b.km=km;save();currentBike=id;toast('走行距離を保存しました');setTimeout(()=>show('home'),400)}function openRecord(id=currentBike){currentBike=id;fillSelects();document.getElementById('rBike').value=id;document.getElementById('rDate').value=new Date().toISOString().slice(0,10);document.getElementById('rKm').value=bike(id).km;document.getElementById('rCost').value='';document.getElementById('rNote').value='';show('record')}function saveRecord(){let id=document.getElementById('rBike').value,b=bike(id),type=document.getElementById('rType').value,date=document.getElementById('rDate').value,km=Number(document.getElementById('rKm').value),cost=Number(document.getElementById('rCost').value)||0,note=document.getElementById('rNote').value.trim();if(!date||!Number.isFinite(km)||km<0)return toast('日付と走行距離を入力してください');if(km>b.km)b.km=km;data.records.push({id:Date.now(),bikeId:id,type,date,km,cost,note});if(type==='オイル交換')b.lastOilKm=km;save();currentBike=id;toast('整備記録を保存しました');setTimeout(()=>show('home'),400)}function backupData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='バイク整備バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('バックアップを作成しました')}function restoreData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.bikes||!Array.isArray(x.records))throw 0;data=x;save();renderHome();toast('データを復元しました')}catch(err){toast('復元できないデータです')}};r.readAsText(f);e.target.value=''}renderHome();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
