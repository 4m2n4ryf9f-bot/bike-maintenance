<html lang="ja">
<head>

<title>GARAGE WORKS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:700px;margin:auto;padding:57px 14px 50px}.titleRow{position:relative;height:180px;margin:0 0 8px;display:flex;justify-content:center;align-items:flex-start}.garageLogo{width:310px;height:auto;display:block}.version{position:absolute;right:10px;bottom:7px;font-size:12px;font-weight:700;color:#333}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.nameWrap{min-width:0;flex:1}.name{font-size:21px;font-weight:800;cursor:pointer}.name:active,.odoValue:active,.photo:active,.photoPlaceholder:active{opacity:.6}.odoValue{font-size:20px;font-weight:800;cursor:pointer}.photo{width:172px;height:128px;object-fit:cover;border-radius:12px;background:#e9ebee;border:1px solid #ddd;display:block;cursor:pointer}.photoPlaceholder{width:172px;height:128px;border-radius:12px;background:#e9ebee;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;cursor:pointer;text-align:center;padding:10px}.label{font-size:12px;color:#6c7075;margin-top:12px}.fuel{font-size:24px;font-weight:800}.fuelLine{display:flex;align-items:center;justify-content:space-between;gap:8px}.resetFuel{border:1px solid #d33;border-radius:9px;background:#fff;color:#c22;padding:6px 9px;font-weight:800;font-size:12px}.actionIcon{width:28px;height:28px;vertical-align:middle;margin-right:10px;fill:currentColor;flex:none}.primary,.secondary{display:flex;align-items:center;justify-content:center;gap:0}.warn{margin-top:8px;padding:9px 11px;border-radius:10px;background:#fff1d6;color:#8a5600;font-size:13px}.ok{margin-top:8px;color:#666;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{cursor:pointer}.primary,.secondary{border:0;border-radius:12px;padding:13px;font-weight:700}.primary{background:#17181a;color:white}.secondary{background:#e7e9ec}.danger{background:#fff0f0;color:#b21d1d;border:1px solid #e2bcbc}.small{padding:8px 10px;border-radius:9px;font-size:12px}.form{display:none;margin-top:12px}.form.open{display:block}.form label{display:block;font-size:12px;color:#666;margin:9px 0 4px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dateRow,.odoRow{display:block}.dateRow input,.odoRow input{width:100%;min-width:0;font-size:15px}input,select,textarea{width:100%;padding:11px;border:1px solid #d5d8dc;border-radius:10px;background:white;font-size:16px}textarea{min-height:90px;resize:vertical}.sectionTitle{font-size:16px;font-weight:800;margin:20px 0 8px}.list{border-top:1px solid #eee;margin-top:12px}.item{padding:10px 0;border-bottom:1px solid #eee;font-size:13px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.itemMain{min-width:0;line-height:1.55}.editBtn{border:0;border-radius:8px;padding:7px 10px;background:#e7e9ec;font-weight:700;white-space:nowrap}.empty{color:#888;font-size:13px;padding:10px 0}.maintRow{display:grid;grid-template-columns:1.35fr .85fr auto auto;gap:8px;margin:8px 0;align-items:center}.settingsBox{margin-top:8px}.historyMemo{white-space:pre-wrap;color:#555;margin-top:3px}.historyDate{color:#777}.subtle{font-size:12px;color:#777}.addMaintRow{display:grid;grid-template-columns:1.35fr .85fr auto;gap:8px;margin-top:12px}details{margin-top:10px}summary{font-weight:700;cursor:pointer;padding:4px 0}.dataTools{margin:0 0 10px}.dataTools details{background:#fff;border-radius:12px;padding:0 12px;box-shadow:0 1px 7px #0001}.dataTools summary{font-size:13px}.dataBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px}.notice{background:#f1f2f4;border-radius:10px;padding:9px 10px;font-size:12px;color:#555;margin-top:10px}@media(max-width:520px){.head{gap:9px}.photo,.photoPlaceholder{width:150px;height:112px}.maintRow{grid-template-columns:1fr 1fr}.maintRow .danger,.maintRow .secondary{grid-column:auto}.addMaintRow{grid-template-columns:1fr 1fr}.addMaintRow button{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app"><div class="titleRow"><img class="garageLogo" src="logo-garage-works.png" alt="GARAGE WORKS"><span class="version">v2.3</span></div>
<div class="dataTools"><details open><summary>クラウド自動同期</summary><div class="notice">給油・メンテ・ODO・写真などを保存すると、設定済みのクラウドへ自動同期します。機種変更後は同じアカウントでログインして復元できます。</div><div id="cloudStatus" class="subtle">クラウド：未設定</div><div id="cloudForm"><label>Supabase Project URL</label><input id="sbUrl" placeholder="https://xxxx.supabase.co"><label>Supabase Anon Key</label><input id="sbKey" type="password" placeholder="eyJ..."><label>メールアドレス</label><input id="sbEmail" type="email" autocomplete="email"><label>パスワード</label><input id="sbPassword" type="password" autocomplete="current-password"><div class="dataBtns"><button class="secondary" onclick="saveCloudConfig()">設定を保存</button><button class="secondary" onclick="cloudSignIn()">ログイン</button></div><div class="dataBtns"><button class="secondary" onclick="cloudSignUp()">新規登録</button><button class="danger small" onclick="cloudSignOut()">ログアウト</button></div></div><div class="subtle">※ Supabase側に1回だけテーブル設定が必要です。ZIP内の「supabase-setup.sql」を使用します。</div></details></div>
<div class="dataTools"><details><summary>データ管理</summary><div class="notice">手動バックアップも残しています。自動バックアップファイルには写真も含まれます。</div><div id="backupStatus" class="subtle">自動バックアップ：待機中</div><div class="dataBtns"><button class="secondary" onclick="backupData()">バックアップ保存</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">バックアップ復元</button></div><input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreData(event)"></details></div>
<div id="bikes"></div></div>
<script>
const KEY="bikeMaintenance_v11";
const PHOTO_DB="garageWorksPhotosV1";
const defaults={bikes:[
{id:"yb",name:"yb125sp",photo:"",odo:12345,fuel:32.1,fuels:[],maint:[{name:"オイル交換",interval:2000,last:12000},{name:"オイルフィルター",interval:4000,last:12000}],maintHistory:[]},
{id:"ds",name:"DragStar 250",photo:"",odo:8920,fuel:28.6,fuels:[],maint:[{name:"オイル交換",interval:2000,last:7040},{name:"オイルフィルター",interval:4000,last:7040}],maintHistory:[]}
]};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||defaults;
data.bikes.forEach(b=>{if(!Array.isArray(b.maint))b.maint=[];if(!Array.isArray(b.maintHistory))b.maintHistory=[]});
const CLOUD_KEY="garageWorksCloudV1";
let cloudClient=null,cloudUser=null;
function getCloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUD_KEY)||"null")}catch(e){return null}}
function setCloudStatus(t){const el=document.getElementById("cloudStatus");if(el)el.textContent=t}
function initCloud(){const c=getCloudConfig();if(!c?.url||!c?.key){setCloudStatus("クラウド：未設定");return}document.getElementById("sbUrl").value=c.url;document.getElementById("sbKey").value=c.key;try{cloudClient=supabase.createClient(c.url,c.key);cloudClient.auth.getSession().then(({data})=>{cloudUser=data.session?.user||null;setCloudStatus(cloudUser?"クラウド：ログイン済み（自動同期ON）":"クラウド：設定済み・未ログイン")})}catch(e){setCloudStatus("クラウド：設定エラー")}}
function saveCloudConfig(){const url=document.getElementById("sbUrl").value.trim(),key=document.getElementById("sbKey").value.trim();if(!url||!key)return alert("Project URLとAnon Keyを入力してください");try{new URL(url)}catch(e){return alert("Project URLを正しく入力してください")}localStorage.setItem(CLOUD_KEY,JSON.stringify({url,key}));initCloud();alert("クラウド設定を保存しました。次にログインしてください。")}
async function cloudSignUp(){if(!cloudClient)return alert("先にクラウド設定を保存してください");const email=document.getElementById("sbEmail").value.trim(),password=document.getElementById("sbPassword").value;if(!email||password.length<6)return alert("メールアドレスと6文字以上のパスワードを入力してください");const {error}=await cloudClient.auth.signUp({email,password});if(error)return alert("新規登録に失敗しました。\n"+error.message);alert("登録しました。メール確認が必要な設定の場合は、届いた確認メールを開いてください。")}
async function cloudSignIn(){if(!cloudClient)return alert("先にクラウド設定を保存してください");const email=document.getElementById("sbEmail").value.trim(),password=document.getElementById("sbPassword").value;if(!email||!password)return alert("メールアドレスとパスワードを入力してください");const {data,error}=await cloudClient.auth.signInWithPassword({email,password});if(error)return alert("ログインに失敗しました。\n"+error.message);cloudUser=data.user;setCloudStatus("クラウド：ログイン済み（自動同期ON）");await cloudPull(true);alert("ログインしました。クラウドのデータを確認しました。")}
async function cloudSignOut(){if(!cloudClient)return;await cloudClient.auth.signOut();cloudUser=null;setCloudStatus("クラウド：ログアウト済み")}
async function cloudPull(silent=false){if(!cloudClient)return false;const {data:{user}}=await cloudClient.auth.getUser();if(!user){cloudUser=null;return false}cloudUser=user;const {data:row,error}=await cloudClient.from("garage_data").select("payload,updated_at").eq("user_id",user.id).maybeSingle();if(error){console.error(error);if(!silent)alert("クラウド読み込みに失敗しました。Supabase設定を確認してください。");return false}if(!row?.payload){setCloudStatus("クラウド：ログイン済み・まだデータなし");return true}if(!confirm("クラウドに保存されているデータがあります。\n\nこのiPhoneの現在データをクラウドデータで上書きしますか？\n\nキャンセルなら、このiPhoneのデータをクラウドへ保存できます。")){await cloudPush(true);return true}data=row.payload.data||data;data.bikes.forEach(b=>{if(!Array.isArray(b.maint))b.maint=[];if(!Array.isArray(b.maintHistory))b.maintHistory=[];b.photo=""});await clearAndWritePhotos(row.payload.photos||{});save(true);await loadPhotos();render();setCloudStatus("クラウド：ログイン済み・同期済み");return true}
async function cloudPush(silent=false){if(!cloudClient)return false;const {data:{user}}=await cloudClient.auth.getUser();if(!user){setCloudStatus("クラウド：未ログイン");return false}const payload=await makeCloudPayload();const {error}=await cloudClient.from("garage_data").upsert({user_id:user.id,payload,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error){console.error(error);setCloudStatus("クラウド：同期失敗");if(!silent)alert("クラウド同期に失敗しました。\n"+error.message);return false}cloudUser=user;setCloudStatus("クラウド：自動同期済み　"+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}));return true}
async function makeCloudPayload(){const photos=await getAllPhotos();const copy=structuredClone(data);copy.bikes.forEach(b=>b.photo="");return {format:"GARAGE WORKS cloud backup",version:"2.3",createdAt:new Date().toISOString(),data:copy,photos}}
function makeBackupPayload(){const copy=structuredClone(data);const photos={};copy.bikes.forEach(b=>{if(b.photo)photos[b.id]=b.photo;b.photo=""});return {format:"GARAGE WORKS backup",version:"2.2",createdAt:new Date().toISOString(),data:copy,photos}}
function downloadBackup(payload,auto=false){const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;const d=new Date(),stamp=d.toISOString().replace(/[:.]/g,"-");a.download=`garage-works-backup-${stamp}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);if(auto)showBackupStatus("自動バックアップ保存済み")}
function autoBackup(){try{downloadBackup(makeBackupPayload(),true)}catch(e){console.error("auto backup",e);showBackupStatus("自動バックアップ失敗")}}
function showBackupStatus(t){const el=document.getElementById("backupStatus");if(el){el.textContent=t+"　"+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});}}
function save(skipAuto=false){const copy=structuredClone(data);copy.bikes.forEach(b=>b.photo="");localStorage.setItem(KEY,JSON.stringify(copy));if(!skipAuto){autoBackup();cloudPush(true)}}
async function getAllPhotos(){const db=await openPhotoDB();return new Promise((resolve,reject)=>{const out={};const tx=db.transaction("photos","readonly"),store=tx.objectStore("photos"),req=store.openCursor();req.onsuccess=()=>{const c=req.result;if(c){out[c.key]=c.value;c.continue()}else{db.close();resolve(out)}};req.onerror=()=>{db.close();reject(req.error)}})}
async function clearAndWritePhotos(photos){const db=await openPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction("photos","readwrite"),store=tx.objectStore("photos");store.clear();Object.entries(photos||{}).forEach(([k,v])=>store.put(v,k));tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function backupData(){try{const photos=await getAllPhotos();const copy=structuredClone(data);copy.bikes.forEach(b=>b.photo="");const payload={format:"GARAGE WORKS backup",version:"2.2",createdAt:new Date().toISOString(),data:copy,photos};downloadBackup(payload,false);showBackupStatus("手動バックアップ保存済み");alert("バックアップを保存しました。\n\n機種変更時は、このファイルを新しいiPhoneへ移して「バックアップ復元」を実行してください。")}catch(e){console.error(e);alert("バックアップの作成に失敗しました。")}}
async function restoreData(e){const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;try{const text=await f.text(),p=JSON.parse(text);if(p.format!=="GARAGE WORKS backup"||!p.data||!Array.isArray(p.data.bikes))throw new Error("invalid");if(!confirm("【第1確認】バックアップからデータを復元します。\n\n現在このiPhoneに保存されているGARAGE WORKSのデータは上書きされます。\n給油履歴・メンテ履歴・ODO・バイク名・写真などがバックアップ時点の状態になります。\n\n本当に続けますか？"))return;if(!confirm("【最終確認】復元を実行すると、現在のデータに戻すには別のバックアップが必要です。\n\nバックアップファイルの内容で上書きします。\nそれでも復元しますか？"))return;data=p.data;data.bikes.forEach(b=>{if(!Array.isArray(b.maint))b.maint=[];if(!Array.isArray(b.maintHistory))b.maintHistory=[];b.photo=""});save(true);await clearAndWritePhotos(p.photos||{});await loadPhotos();render();alert("バックアップを復元しました。")}catch(err){console.error(err);alert("このファイルはGARAGE WORKSのバックアップではないか、壊れています。")}}
function bike(id){return data.bikes.find(b=>b.id===id)}
function fmt(n){return Number(n||0).toLocaleString("ja-JP")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function averageFuel(b){const fuels=(b.fuels||[]).slice().sort((a,b)=>Number(a.odo)-Number(b.odo));const resetAt=Number.isFinite(Number(b.fuelResetAt))?Number(b.fuelResetAt):null;const recent=resetAt===null?fuels:fuels.filter(f=>Number(f.ts||0)>resetAt);if(recent.length<2)return resetAt===null&&Number.isFinite(b.fuel)?b.fuel:null;let distance=0,liters=0;for(let i=1;i<recent.length;i++){const d=Number(recent[i].odo)-Number(recent[i-1].odo),l=Number(recent[i].liters);if(d>0&&l>0){distance+=d;liters+=l}}return liters>0?distance/liters:null}
function warnings(b){return b.maint.map(m=>[m,m.last+m.interval-b.odo]).filter(x=>x[1]<=300).map(x=>x[1]<=0?"⚠ "+x[0].name+"が必要です":"⚠ "+x[0].name+"まであと"+fmt(x[1])+"km")}
function render(){document.getElementById("bikes").innerHTML=data.bikes.map(b=>{
const avg=averageFuel(b);const photo=b.photo?`<img class="photo" src="${b.photo}" alt="${esc(b.name)}の写真">`:`<div class="photoPlaceholder">写真を追加</div>`;
return `<div class="card"><div class="head"><div><label for="file-${b.id}" style="display:block">${photo}</label><input id="file-${b.id}" type="file" accept="image/*" style="display:none" onchange="setPhoto(event,'${b.id}')"></div><div class="nameWrap"><div class="name" onclick="renameBike('${b.id}')" title="タップして名称変更">${esc(b.name)}</div><div class="label">現在の走行距離</div><div class="odoValue" onclick="editOdo('${b.id}')" title="タップして編集">${fmt(b.odo)} km</div><div class="label">平均燃費</div><div class="fuelLine"><div class="fuel">${avg!=null?avg.toFixed(1):"—"} km/L</div>${b.fuels&&b.fuels.length?`<button class="resetFuel" onclick="resetFuel('${b.id}')">リセット</button>`:""}</div></div></div>${warnings(b).map(x=>`<div class="warn">${x}</div>`).join("")||'<div class="ok">メンテナンス警告なし</div>'}<div class="actions"><button class="primary" onclick="toggle('fuel-${b.id}')"><svg class="actionIcon" viewBox="0 0 64 64" aria-hidden="true"><path d="M18 8h24c3 0 5 2 5 5v38H18V8zm6 6v13h12V14H24zm27 7c5 1 8 5 8 10v11c0 3 2 5 4 5v6c-6 0-10-4-10-10V32c0-2-1-4-3-5v-7l5 1zm-2 4v12h5V28l-5-3zM12 51h38v6H12z"/></svg>給油を記録</button><button class="secondary" onclick="toggle('maint-${b.id}')"><svg class="actionIcon" viewBox="0 0 64 64" aria-hidden="true"><path d="M42 8a14 14 0 0 0-13 19L9 47a6 6 0 1 0 8 8l20-20a14 14 0 0 0 19-17l-9 9-8-3-3-8 9-8a14 14 0 0 0-3-0zm-28 42a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>メンテ記録</button></div>
<div id="fuel-${b.id}" class="form"><div class="sectionTitle">給油</div><div class="dateRow"><label>日付</label><input id="date-${b.id}" type="date"></div><div class="odoRow"><label>走行距離（ODO km）</label><input id="odo-${b.id}" type="number" value="${b.odo}"></div><div class="row"><div><label>リッター（L）</label><input id="lit-${b.id}" type="number" step="0.01"></div><div><label>金額（円）</label><input id="yen-${b.id}" type="number"></div></div><button class="primary" style="margin-top:10px;width:100%" onclick="addFuel('${b.id}')">保存</button></div>
<div id="maint-${b.id}" class="form"><div class="sectionTitle">メンテナンス</div>${b.maint.length?`<div class="row"><div><label>項目</label><select id="mi-${b.id}">${b.maint.map((m,i)=>`<option value="${i}">${esc(m.name)}</option>`).join("")}</select></div><div><label>実施距離 km</label><input id="mm-${b.id}" type="number" value="${b.odo}"></div></div><label>メモ・備考</label><textarea id="memo-${b.id}" placeholder="交換部品、症状、作業内容、部品番号など自由に記録"></textarea><button class="primary" style="margin-top:10px;width:100%" onclick="addMaint('${b.id}')">交換・整備済みにする</button>`:`<div class="notice">メンテ項目がありません。下の「メンテ項目を管理」から追加してください。</div>`}
<details><summary>メンテ項目を管理</summary><div class="subtle">項目名と、何kmごとに必要かを設定できます。</div><div class="settingsBox">${b.maint.map((m,i)=>`<div class="maintRow"><input id="mn-${b.id}-${i}" value="${esc(m.name)}"><input id="iv-${b.id}-${i}" type="number" value="${m.interval}" min="1"><button class="secondary small" onclick="saveSettings('${b.id}',${i})">保存</button><button class="danger small" onclick="deleteMaintItem('${b.id}',${i})">削除</button></div>`).join("")}<div class="addMaintRow"><input id="newmn-${b.id}" placeholder="新しいメンテ項目"><input id="newiv-${b.id}" type="number" min="1" placeholder="間隔 km"><button class="primary" onclick="addMaintItem('${b.id}')">＋項目を追加</button></div></div></details></div>
<details><summary>メンテ履歴</summary><div class="list">${b.maintHistory.slice().reverse().map((h,ri)=>{const idx=b.maintHistory.length-1-ri;return `<div class="item"><div class="itemMain"><strong>${esc(h.name)}</strong><br><span class="historyDate">${esc(h.date)}　ODO ${fmt(h.odo)}km</span>${h.memo?`<div class="historyMemo">${esc(h.memo)}</div>`:""}</div><button class="editBtn" onclick="editMaintHistory('${b.id}',${idx})">修正</button></div>`}).join("")||'<div class="empty">まだメンテ履歴がありません</div>'}</div></details>
<details><summary>給油履歴</summary><div class="list">${b.fuels.slice().reverse().map(f=>{const idx=b.fuels.indexOf(f);return `<div class="item"><div class="itemMain">${esc(f.date)}　${f.liters}L　${fmt(f.yen)}円　ODO ${fmt(f.odo)}km${f.economy?`　(${f.economy.toFixed(1)}km/L)`:""}</div><button class="editBtn" onclick="editFuel('${b.id}',${idx})">修正</button></div>`}).join("")||'<div class="empty">まだ記録がありません</div>'}</div></details></div>`;
}).join("");loadPhotos();}
function toggle(id){document.getElementById(id).classList.toggle("open")}
function renameBike(id){const b=bike(id),n=prompt("バイク名称を入力してください",b.name);if(n===null)return;const name=n.trim();if(!name)return alert("名称を入力してください");b.name=name;save();render()}
function openPhotoDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(PHOTO_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function savePhotoDB(id,val){const db=await openPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction("photos","readwrite");tx.objectStore("photos").put(val,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function loadPhotos(){try{const db=await openPhotoDB();let changed=false;for(const b of data.bikes){let p=await new Promise((res,rej)=>{const r=db.transaction("photos","readonly").objectStore("photos").get(b.id);r.onsuccess=()=>res(r.result||"");r.onerror=()=>rej(r.error)});if(!p&&b.photo){p=b.photo;await savePhotoDB(b.id,p);changed=true}b.photo=p||""}db.close();if(changed)save(true);document.querySelectorAll(".photoPlaceholder,.photo").forEach(()=>{});if(changed)render()}catch(e){console.log(e)}}
function setPhoto(e,id){const f=e.target.files&&e.target.files[0];if(!f)return;const img=new Image(),url=URL.createObjectURL(f);img.onload=async()=>{try{const max=1000,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);const val=c.toDataURL("image/jpeg",.65);await savePhotoDB(id,val);bike(id).photo=val;autoBackup();render()}catch(err){alert("写真の保存に失敗しました。もう一度お試しください。")}finally{URL.revokeObjectURL(url);e.target.value=""}};img.onerror=()=>{URL.revokeObjectURL(url);e.target.value="";alert("写真を読み込めませんでした")};img.src=url}
function recalcFuel(b){b.fuels.sort((a,b)=>Number(a.odo)-Number(b.odo));for(let i=0;i<b.fuels.length;i++){if(i===0){b.fuels[i].economy=null;continue}const d=Number(b.fuels[i].odo)-Number(b.fuels[i-1].odo),l=Number(b.fuels[i].liters);b.fuels[i].economy=d>0&&l>0?d/l:null}b.fuel=averageFuel(b);if(b.fuels.length)b.odo=Math.max(Number(b.odo)||0,...b.fuels.map(f=>Number(f.odo)||0))}
function addFuel(id){const b=bike(id),date=document.getElementById("date-"+id).value,odo=+document.getElementById("odo-"+id).value,liters=+document.getElementById("lit-"+id).value,yen=+document.getElementById("yen-"+id).value;if(!date||!Number.isFinite(odo)||odo<=0||!Number.isFinite(liters)||liters<=0)return alert("日付・ODO・リッターを正しく入力してください");if(odo<b.odo)return alert("ODOは現在の走行距離より小さくできません。現在ODOは "+fmt(b.odo)+" km です。");b.fuels.push({date,odo,liters,yen,ts:Date.now()});recalcFuel(b);save();render()}
function editOdo(id){const b=bike(id),v=prompt("現在の走行距離（km）を入力してください",b.odo);if(v===null)return;const odo=Number(v.replace(/,/g,""));if(!Number.isFinite(odo)||odo<0)return alert("走行距離を正しく入力してください");b.odo=odo;save();render()}
function resetFuel(id){const b=bike(id);if(!b.fuels||!b.fuels.length)return;if(!confirm("【第1確認】平均燃費だけをリセットします。\n\n給油履歴はすべて残ります。\nリセット後に追加する給油記録から、新しい平均燃費を計算します。\n現在の走行距離・写真・メンテナンス記録も残ります。\n\n本当に続けますか？"))return;if(!confirm("【最終確認】平均燃費の計算だけをリセットします。\n\n給油履歴は削除されません。\nこの操作自体は元に戻せません。\n\nそれでも実行しますか？"))return;const word=prompt("安全確認のため「リセット」と入力してください");if(word!=="リセット")return alert("リセットを中止しました。");b.fuelResetAt=Date.now();b.fuel=null;save();render();alert("平均燃費だけをリセットしました。給油履歴は残っています。")}
function editFuel(id,idx){const b=bike(id),f=b.fuels[idx];if(!f)return;const date=prompt("給油日",f.date);if(date===null)return;const odo=Number(prompt("ODO（km）",f.odo));if(!Number.isFinite(odo)||odo<=0)return alert("ODOを正しく入力してください");const liters=Number(prompt("給油量（L）",f.liters));if(!Number.isFinite(liters)||liters<=0)return alert("リッターを正しく入力してください");const yen=Number(prompt("金額（円）",f.yen));if(!Number.isFinite(yen)||yen<0)return alert("金額を正しく入力してください");b.fuels[idx]={...b.fuels[idx],date,odo,liters,yen};recalcFuel(b);save();render()}
function addMaint(id){const b=bike(id),i=+document.getElementById("mi-"+id).value,km=+document.getElementById("mm-"+id).value||b.odo,memo=document.getElementById("memo-"+id).value.trim();const m=b.maint[i];if(!m)return alert("メンテ項目を選択してください");const today=new Date().toISOString().slice(0,10);m.last=km;b.maintHistory.push({date:today,odo:km,name:m.name,memo});save();render()}
function editMaintHistory(id,idx){const b=bike(id),h=b.maintHistory[idx];if(!h)return;const date=prompt("実施日",h.date);if(date===null)return;const odo=Number(prompt("実施距離（ODO km）",h.odo));if(!Number.isFinite(odo)||odo<0)return alert("実施距離を正しく入力してください");const name=prompt("メンテ項目",h.name);if(name===null)return;const memo=prompt("メモ・備考",h.memo||"");if(memo===null)return;h.date=date;h.odo=odo;h.name=name.trim()||h.name;h.memo=memo;b.maint.forEach(m=>{if(m.name===h.name)m.last=odo});save();render()}
function saveSettings(id,i){const b=bike(id),name=document.getElementById(`mn-${id}-${i}`).value.trim(),interval=Number(document.getElementById(`iv-${id}-${i}`).value);if(!name)return alert("項目名を入力してください");if(!Number.isFinite(interval)||interval<=0)return alert("必要距離を正しく入力してください");b.maint[i].name=name;b.maint[i].interval=interval;save();render()}
function addMaintItem(id){const b=bike(id),name=document.getElementById("newmn-"+id).value.trim(),interval=Number(document.getElementById("newiv-"+id).value);if(!name)return alert("新しいメンテ項目名を入力してください");if(!Number.isFinite(interval)||interval<=0)return alert("間隔kmを正しく入力してください");b.maint.push({name,interval,last:b.odo});save();render()}
function deleteMaintItem(id,i){const b=bike(id),m=b.maint[i];if(!m)return;if(!confirm(`「${m.name}」をメンテ項目から削除します。\n\nメンテ履歴は削除されません。\nこの項目を削除してよろしいですか？`))return;b.maint.splice(i,1);save();render()}
render();
initCloud();
</script>
