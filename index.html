<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GARAGE WORKS"><link rel="manifest" href="manifest.webmanifest"><title>GARAGE WORKS</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:700px;margin:auto;padding:43px 14px 50px}.title{font-size:26px;font-weight:800;margin:0 0 18px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.nameWrap{min-width:0;flex:1}.name{cursor:pointer}.name:active{opacity:.6}.name{font-size:21px;font-weight:800}.photo{width:172px;height:128px;object-fit:cover;border-radius:12px;background:#e9ebee;border:1px solid #ddd;display:block;cursor:pointer}.photoPlaceholder{width:172px;height:128px;border-radius:12px;background:#e9ebee;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;cursor:pointer;text-align:center;padding:10px}.photo:active,.photoPlaceholder:active{opacity:.7}.label{font-size:12px;color:#6c7075;margin-top:12px}.fuel{font-size:24px;font-weight:800}.warn{margin-top:8px;padding:9px 11px;border-radius:10px;background:#fff1d6;color:#8a5600;font-size:13px}.ok{margin-top:8px;color:#666;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{cursor:pointer}.primary,.secondary{border:0;border-radius:12px;padding:13px;font-weight:700}.primary{background:#17181a;color:white}.secondary{background:#e7e9ec}input,select{width:100%;padding:11px;border:1px solid #d5d8dc;border-radius:10px;background:white;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form{display:none;margin-top:12px}.form.open{display:block}.form label{display:block;font-size:12px;color:#666;margin:9px 0 4px}.sectionTitle{font-size:16px;font-weight:800;margin:20px 0 8px}.list{border-top:1px solid #eee;margin-top:12px}.item{padding:10px 0;border-bottom:1px solid #eee;font-size:13px}.empty{color:#888;font-size:13px;padding:10px 0}.maintRow{display:grid;grid-template-columns:1.5fr 1fr auto;gap:8px;margin:8px 0}details{margin-top:10px}summary{font-weight:700;cursor:pointer}@media(max-width:420px){.row{grid-template-columns:1fr}.maintRow{grid-template-columns:1fr 1fr}.maintRow button{grid-column:2}}
</style></head><body><div class="app"><h1 class="title">GARAGE WORKS</h1><div id="bikes"></div></div><script>
const KEY="bikeMaintenance_v11";const defaults={bikes:[{id:"yb",name:"yb125sp",photo:"",odo:12345,fuel:32.1,fuels:[],maint:[{name:"オイル交換",interval:2000,last:12000},{name:"オイルフィルター",interval:4000,last:12000}]},{id:"ds",name:"DragStar 250",photo:"",odo:8920,fuel:28.6,fuels:[],maint:[{name:"オイル交換",interval:2000,last:7040},{name:"オイルフィルター",interval:4000,last:7040}]}]};let data=JSON.parse(localStorage.getItem(KEY)||"null")||defaults;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function bike(id){return data.bikes.find(b=>b.id===id)}function fmt(n){return Number(n||0).toLocaleString("ja-JP")}
function warnings(b){return b.maint.map(m=>[m,m.last+m.interval-b.odo]).filter(x=>x[1]<=300).map(x=>x[1]<=0?"⚠ "+x[0].name+"が必要です":"⚠ "+x[0].name+"まであと"+fmt(x[1])+"km")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function averageFuel(b){
  const fuels=b.fuels||[];
  if(fuels.length<2)return Number.isFinite(b.fuel)?b.fuel:null;
  let distance=0,liters=0;
  for(let i=1;i<fuels.length;i++){
    const d=Number(fuels[i].odo)-Number(fuels[i-1].odo);
    const l=Number(fuels[i].liters);
    if(d>0&&l>0){distance+=d;liters+=l;}
  }
  return liters>0?distance/liters:(Number.isFinite(b.fuel)?b.fuel:null);
}
function render(){document.getElementById("bikes").innerHTML=data.bikes.map(b=>{
  const avg=averageFuel(b);
  const photo=b.photo?`<img class="photo" src="${b.photo}" alt="${esc(b.name)}の写真" onclick="pickPhoto('${b.id}')">`:`<div class="photoPlaceholder" onclick="pickPhoto('${b.id}')">写真を追加</div>`;
  return `<div class="card"><div class="head"><div class="nameWrap"><div class="name" onclick="renameBike('${b.id}')" title="タップして名称変更">${esc(b.name)}</div><div class="label">現在の走行距離</div><div style="font-size:20px;font-weight:800">${fmt(b.odo)} km</div><div class="label">平均燃費</div><div class="fuel">${avg!=null?avg.toFixed(1):"—"} km/L</div></div><div><div onclick="pickPhoto('${b.id}')">${photo}</div><input id="file-${b.id}" type="file" accept="image/*" style="display:none" onchange="setPhoto(event,'${b.id}')"></div></div>${warnings(b).map(x=>`<div class="warn">${x}</div>`).join("")||'<div class="ok">メンテナンス警告なし</div>'}<div class="actions"><button class="primary" onclick="toggle('fuel-${b.id}')">＋給油を記録</button><button class="secondary" onclick="toggle('maint-${b.id}')">＋メンテ記録</button></div><div id="fuel-${b.id}" class="form"><div class="sectionTitle">給油</div><div class="row"><div><label>日付</label><input id="date-${b.id}" type="date"></div><div><label>走行距離（ODO km）</label><input id="odo-${b.id}" type="number" value="${b.odo}"></div></div><div class="row"><div><label>リッター（L）</label><input id="lit-${b.id}" type="number" step="0.01"></div><div><label>金額（円）</label><input id="yen-${b.id}" type="number"></div></div><button class="primary" style="margin-top:10px;width:100%" onclick="addFuel('${b.id}')">保存</button></div><div id="maint-${b.id}" class="form"><div class="sectionTitle">メンテナンス</div><div class="row"><div><label>項目</label><select id="mi-${b.id}">${b.maint.map((m,i)=>`<option value="${i}">${esc(m.name)}</option>`).join("")}</select></div><div><label>実施距離 km</label><input id="mm-${b.id}" type="number" value="${b.odo}"></div></div><button class="primary" style="margin-top:10px;width:100%" onclick="addMaint('${b.id}')">交換・整備済みにする</button><details><summary>必要距離を設定</summary><div id="settings-${b.id}"></div></details></div><details><summary>給油履歴</summary><div class="list">${b.fuels.slice().reverse().map(f=>`<div class="item">${esc(f.date)}　${f.liters}L　${fmt(f.yen)}円　ODO ${fmt(f.odo)}km${f.economy?`　(${f.economy.toFixed(1)}km/L)`:""}</div>`).join("")||'<div class="empty">まだ記録がありません</div>'}</div></details></div>`;
}).join("");data.bikes.forEach(renderSettings)}
function renameBike(id){const b=bike(id);const n=prompt("バイク名称を入力してください",b.name);if(n===null)return;const name=n.trim();if(!name)return alert("名称を入力してください");b.name=name;save();render()}
function renderSettings(b){let e=document.getElementById("settings-"+b.id);if(!e)return;e.innerHTML=b.maint.map((m,i)=>`<div class="maintRow"><input id="mn-${b.id}-${i}" value="${m.name}"><input id="iv-${b.id}-${i}" type="number" value="${m.interval}"><button class="secondary" onclick="saveSettings('${b.id}')">保存</button></div>`).join("")}
function toggle(id){document.getElementById(id).classList.toggle("open")}
function pickPhoto(id){document.getElementById("file-"+id).click()}
function setPhoto(e,id){
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{
    const max=900, scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.naturalWidth*scale)); c.height=Math.max(1,Math.round(img.naturalHeight*scale));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const data=c.toDataURL("image/jpeg",0.72); URL.revokeObjectURL(url);
    bike(id).photo=data;
    try{save();render()}catch(err){bike(id).photo="";alert("写真の保存に失敗しました。別の写真でもう一度試してください。")}
  };
  img.onerror=()=>{URL.revokeObjectURL(url);alert("写真を読み込めませんでした")};
  img.src=url;
}
function addFuel(id){
  const b=bike(id),date=document.getElementById("date-"+id).value,odo=+document.getElementById("odo-"+id).value,liters=+document.getElementById("lit-"+id).value,yen=+document.getElementById("yen-"+id).value;
  if(!date||!Number.isFinite(odo)||odo<=0||!Number.isFinite(liters)||liters<=0)return alert("日付・ODO・リッターを正しく入力してください");
  if(odo<b.odo)return alert("ODOは現在の走行距離より小さくできません。現在ODOは "+fmt(b.odo)+" km です。");
  const p=b.fuels.at(-1);
  const economy=p&&odo>p.odo?(odo-p.odo)/liters:null;
  b.fuels.push({date,odo,liters,yen,economy}); b.odo=odo;
  if(economy){b.fuel=economy}
  b.fuel=averageFuel(b);
  save(); render();
}
function addMaint(id){let b=bike(id),i=+document.getElementById("mi-"+id).value,km=+document.getElementById("mm-"+id).value||b.odo;b.maint[i].last=km;save();render()}function saveSettings(id){let b=bike(id);b.maint.forEach((m,i)=>{m.name=document.getElementById(`mn-${id}-${i}`).value;m.interval=+document.getElementById(`iv-${id}-${i}`).value||m.interval});save();render()}render();
</script></body></html>
