<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="バイク整備"><link rel="manifest" href="manifest.webmanifest"><title>バイク整備</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:700px;margin:auto;padding:32px 14px 50px}.title{font-size:26px;font-weight:800;margin:0 0 18px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.name{font-size:21px;font-weight:800}.photo{width:86px;height:64px;object-fit:cover;border-radius:12px;background:#e9ebee;border:1px solid #ddd}.photoBtn{border:0;border-radius:9px;padding:7px 9px;font-size:12px;background:#e7e9ec}.label{font-size:12px;color:#6c7075;margin-top:12px}.fuel{font-size:24px;font-weight:800}.warn{margin-top:8px;padding:9px 11px;border-radius:10px;background:#fff1d6;color:#8a5600;font-size:13px}.ok{margin-top:8px;color:#666;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{cursor:pointer}.primary,.secondary{border:0;border-radius:12px;padding:13px;font-weight:700}.primary{background:#17181a;color:white}.secondary{background:#e7e9ec}input,select{width:100%;padding:11px;border:1px solid #d5d8dc;border-radius:10px;background:white;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form{display:none;margin-top:12px}.form.open{display:block}.form label{display:block;font-size:12px;color:#666;margin:9px 0 4px}.sectionTitle{font-size:16px;font-weight:800;margin:20px 0 8px}.list{border-top:1px solid #eee;margin-top:12px}.item{padding:10px 0;border-bottom:1px solid #eee;font-size:13px}.empty{color:#888;font-size:13px;padding:10px 0}.maintRow{display:grid;grid-template-columns:1.5fr 1fr auto;gap:8px;margin:8px 0}details{margin-top:10px}summary{font-weight:700;cursor:pointer}@media(max-width:420px){.row{grid-template-columns:1fr}.maintRow{grid-template-columns:1fr 1fr}.maintRow button{grid-column:2}}
</style></head><body><div class="app"><h1 class="title">バイク整備</h1><div id="bikes"></div></div><script>
const KEY="bikeMaintenance_v1";const defaults={bikes:[{id:"yb",name:"yb125sp",photo:"",odo:12345,fuel:32.1,fuels:[],maint:[{name:"オイル交換",interval:2000,last:12000},{name:"オイルフィルター",interval:4000,last:12000}]},{id:"ds",name:"DragStar 250",photo:"",odo:8920,fuel:28.6,fuels:[],maint:[{name:"オイル交換",interval:2000,last:7040},{name:"オイルフィルター",interval:4000,last:7040}]}]};let data=JSON.parse(localStorage.getItem(KEY)||"null")||defaults;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function bike(id){return data.bikes.find(b=>b.id===id)}function fmt(n){return Number(n||0).toLocaleString("ja-JP")}
function warnings(b){return b.maint.map(m=>[m,m.last+m.interval-b.odo]).filter(x=>x[1]<=300).map(x=>x[1]<=0?"⚠ "+x[0].name+"が必要です":"⚠ "+x[0].name+"まであと"+fmt(x[1])+"km")}
function render(){document.getElementById("bikes").innerHTML=data.bikes.map(b=>`<div class="card"><div class="head"><div><div class="name">${b.name}</div><div class="label">現在の走行距離</div><div style="font-size:20px;font-weight:800">${fmt(b.odo)} km</div><div class="label">燃費</div><div class="fuel">${b.fuel?b.fuel.toFixed(1):"—"} km/L</div></div><div><img class="photo" ${b.photo?`src="${b.photo}"`:"style='display:none'"}><br><button class="photoBtn" onclick="pickPhoto('${b.id}')">${b.photo?"写真変更":"写真を追加"}</button><input id="file-${b.id}" type="file" accept="image/*" style="display:none" onchange="setPhoto(event,'${b.id}')"></div></div>${warnings(b).map(x=>`<div class="warn">${x}</div>`).join("")||'<div class="ok">メンテナンス警告なし</div>'}<div class="actions"><button class="primary" onclick="toggle('fuel-${b.id}')">＋給油を記録</button><button class="secondary" onclick="toggle('maint-${b.id}')">＋メンテ記録</button></div><div id="fuel-${b.id}" class="form"><div class="sectionTitle">給油</div><div class="row"><div><label>日付</label><input id="date-${b.id}" type="date"></div><div><label>走行距離（ODO km）</label><input id="odo-${b.id}" type="number" value="${b.odo}"></div></div><div class="row"><div><label>リッター（L）</label><input id="lit-${b.id}" type="number" step="0.01"></div><div><label>金額（円）</label><input id="yen-${b.id}" type="number"></div></div><button class="primary" style="margin-top:10px;width:100%" onclick="addFuel('${b.id}')">保存</button></div><div id="maint-${b.id}" class="form"><div class="sectionTitle">メンテナンス</div><div class="row"><div><label>項目</label><select id="mi-${b.id}">${b.maint.map((m,i)=>`<option value="${i}">${m.name}</option>`).join("")}</select></div><div><label>実施距離 km</label><input id="mm-${b.id}" type="number" value="${b.odo}"></div></div><button class="primary" style="margin-top:10px;width:100%" onclick="addMaint('${b.id}')">交換・整備済みにする</button><details><summary>必要距離を設定</summary><div id="settings-${b.id}"></div></details></div><details><summary>給油履歴</summary><div class="list">${b.fuels.slice().reverse().map(f=>`<div class="item">${f.date}　${f.liters}L　${fmt(f.yen)}円　ODO ${fmt(f.odo)}km${f.economy?`　(${f.economy.toFixed(1)}km/L)`:""}</div>`).join("")||'<div class="empty">まだ記録がありません</div>'}</div></details></div>`).join("");data.bikes.forEach(renderSettings)}
function renderSettings(b){let e=document.getElementById("settings-"+b.id);if(!e)return;e.innerHTML=b.maint.map((m,i)=>`<div class="maintRow"><input id="mn-${b.id}-${i}" value="${m.name}"><input id="iv-${b.id}-${i}" type="number" value="${m.interval}"><button class="secondary" onclick="saveSettings('${b.id}')">保存</button></div>`).join("")}
function toggle(id){document.getElementById(id).classList.toggle("open")}function pickPhoto(id){document.getElementById("file-"+id).click()}function setPhoto(e,id){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{bike(id).photo=r.result;save();render()};r.readAsDataURL(f)}
function addFuel(id){let b=bike(id),date=document.getElementById("date-"+id).value,odo=+document.getElementById("odo-"+id).value,liters=+document.getElementById("lit-"+id).value,yen=+document.getElementById("yen-"+id).value;if(!date||!odo||!liters)return alert("日付・ODO・リッターを入力してください");let p=b.fuels.at(-1),economy=p&&odo>p.odo?(odo-p.odo)/liters:null;b.fuels.push({date,odo,liters,yen,economy});b.odo=odo;if(economy)b.fuel=economy;save();render()}
function addMaint(id){let b=bike(id),i=+document.getElementById("mi-"+id).value,km=+document.getElementById("mm-"+id).value||b.odo;b.maint[i].last=km;save();render()}function saveSettings(id){let b=bike(id);b.maint.forEach((m,i)=>{m.name=document.getElementById(`mn-${id}-${i}`).value;m.interval=+document.getElementById(`iv-${id}-${i}`).value||m.interval});save();render()}render();
</script></body></html>
